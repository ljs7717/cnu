<form id="contact-form">
  <input type="text" name="user_name" placeholder="이름을 입력하세요" required>
  <input type="email" name="user_email" placeholder="이메일 입력하세요" required>
  <textarea name="message" placeholder="메시지를 입력하세요" required></textarea>
  <button type="submit">전송하기</button>
</form>

<!-- EmailJS SDK 로드 -->
<script type="text/javascript" src="https://jsdelivr.net"></script>
<script type="text/javascript">
  // 본인의 Public Key를 입력해 초기화
  (function() {
      emailjs.init({
        publicKey: "E4Z2O1i7cW0F4F35p",
      });
  })();

  window.onload = function() {
      document.getElementById('contact-form').addEventListener('submit', function(event) {
          event.preventDefault();

          // serviceID와 templateID, 그리고 form 요소를 전달
          emailjs.sendForm('service_fyyno6t', 'template_iox8ggo', this)
              .then(() => {
                  alert('메일이 성공적으로 전송되었습니다!');
                  this.reset();
              }, (error) => {
                  alert('메일 전송에 실패했습니다: ' + JSON.stringify(error));
              });
      });
  };
</script>
